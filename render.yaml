services:
  - type: web
    name: cupcake-delivery
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m app.seed"
    startCommand: "gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cupcake-delivery-db
          property: connectionString

databases:
  - name: cupcake-delivery-db
    plan: free
